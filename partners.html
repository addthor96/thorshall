<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Partners | Thor's Hall</title>

<style>
:root{
--gold:#d4a74f;
--gold2:#f0d28b;
--gold3:#fff0be;
--text:#f4ede2;
--line:rgba(212,167,79,.24);
}

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
color:var(--text);
background:
linear-gradient(rgba(5,3,2,.20),rgba(5,3,2,.65)),
url('img/wallbackground.png') center center/cover fixed no-repeat,
#050302;
overflow-x:hidden;
}

.wrap{
width:100%;
padding:20px 20px 80px;
}

.topbar{
max-width:1380px;
margin:0 auto 22px;
display:flex;
justify-content:space-between;
align-items:center;
gap:14px;
padding:16px 18px;
border-radius:20px;
border:1px solid var(--line);
background:rgba(0,0,0,.52);
backdrop-filter:blur(4px);
box-shadow:0 18px 44px rgba(0,0,0,.34);
}

.brand{
display:flex;
align-items:center;
gap:12px;
text-decoration:none;
color:#fff;
font-size:28px;
font-weight:900;
letter-spacing:.04em;
}

.brand img{
width:42px;
height:42px;
border-radius:10px;
object-fit:cover;
}

.nav{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.nav a{
display:inline-flex;
align-items:center;
justify-content:center;
padding:13px 22px;
border-radius:14px;
font-weight:900;
text-decoration:none;
border:1px solid rgba(255,230,170,.38);
background:linear-gradient(180deg,var(--gold3),var(--gold));
color:#211407!important;
box-shadow:
0 10px 24px rgba(0,0,0,.25),
inset 0 1px 0 rgba(255,255,255,.25);
}

.nav a.manager-btn{
color:#fff!important;
background:linear-gradient(180deg,#d7655c,#a83232 48%,#7f2424);
border-color:rgba(255,140,130,.52);
}

.partner-wall{
position:relative;
width:calc(100vw - 40px);
max-width:1800px;
height:1150px;
margin:0 auto;
border-radius:28px;
overflow:hidden;
box-shadow:
0 40px 120px rgba(0,0,0,.75),
inset 0 0 80px rgba(0,0,0,.35);
}

.wall-image{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
object-position:center top;
transform:scale(1.52);
user-select:none;
-webkit-user-drag:none;
pointer-events:none;
}

.wall-content-zone{
position:absolute;
z-index:3;

/* THIS controls how close wall is to edges */
left:2cm;
right:2cm;
top:120px;
bottom:90px;

/* invisible helper */
border-radius:20px;
}

@media(max-width:1200px){

.partner-wall{
height:980px;
}

.wall-image{
transform:scale(1.65);
}

.wall-content-zone{
left:28px;
right:28px;
top:100px;
bottom:70px;
}
}

@media(max-width:760px){

.wrap{
padding:12px 12px 50px;
}

.topbar{
flex-direction:column;
align-items:flex-start;
}

.nav{
width:100%;
}

.nav a{
width:100%;
}

.partner-wall{
width:calc(100vw - 24px);
height:760px;
border-radius:22px;
}

.wall-image{
transform:scale(1.95);
}

.wall-content-zone{
left:16px;
right:16px;
top:70px;
bottom:50px;
}
}
</style>
</head>

<body>

<div class="wrap">

<header class="topbar">

<a class="brand" href="https://thorshall.gg">
<img src="img/logo.png" alt="Thor's Hall Logo">
<span>THOR'S HALL</span>
</a>

<nav class="nav">
<a href="https://thorshall.gg/about">About</a>
<a href="https://thorshall.gg/info">Info</a>
<a href="https://thorshall.gg/guide">Guide</a>
<a href="https://thorshall.gg/creators">Creators</a>
<a class="manager-btn" href="https://thorshall.gg/managers">Managers</a>
<a href="https://playrainbet.com/tkpmo0r1x" target="_blank" rel="nofollow sponsored noopener">Join Rainbet</a>
</nav>

</header>

<section class="partner-wall">

<img
class="wall-image"
src="img/wall.png"
alt="Thor's Hall Partner Wall"
loading="eager"
decoding="async"
fetchpriority="high"
>

<div class="wall-content-zone">
<!-- PARTNER CONTENT GOES HERE -->
</div>

</section>

</div>

</body>
</html>
