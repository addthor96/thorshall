<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Partners | Thor's Hall</title>

<style>
:root{
--gold:#d4a74f;
--gold2:#f0d28b;
--gold3:#fff0be;
--text:#f4ede2;
--line:rgba(212,167,79,.24);
}

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#050302;
color:var(--text);
overflow-x:hidden;
}

.wrap{
max-width:1180px;
margin:auto;
padding:26px 18px 80px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:14px;
padding:16px 18px;
border-radius:20px;
border:1px solid var(--line);
background:rgba(0,0,0,.46);
backdrop-filter:blur(8px);
box-shadow:0 18px 44px rgba(0,0,0,.34);
margin-bottom:28px;
}

.brand{
display:flex;
align-items:center;
gap:12px;
text-decoration:none;
color:#fff;
font-size:28px;
font-weight:900;
letter-spacing:.04em;
}

.brand img{
width:42px;
height:42px;
border-radius:10px;
object-fit:cover;
}

.nav{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.nav a{
display:inline-flex;
align-items:center;
justify-content:center;
padding:13px 22px;
border-radius:14px;
font-weight:900;
text-decoration:none;
border:1px solid rgba(255,230,170,.38);
background:linear-gradient(180deg,var(--gold3),var(--gold));
color:#211407!important;
box-shadow:0 10px 24px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.25);
}

.nav a.manager-btn{
color:#fff!important;
background:linear-gradient(180deg,#d7655c,#a83232 48%,#7f2424);
border-color:rgba(255,140,130,.52);
}

.partner-wall{
position:relative;
width:100%;
min-height:1200px;
border-radius:30px;
overflow:hidden;
border:1px solid rgba(212,167,79,.18);
}

.partner-wall img{
width:100%;
display:block;
user-select:none;
pointer-events:none;
}

.wall-overlay{
position:absolute;
inset:0;
display:flex;
justify-content:center;
align-items:flex-start;
padding-top:220px;
}

.wall-title{
text-align:center;
}

.wall-title h1{
font-size:clamp(52px,7vw,92px);
margin:0;
letter-spacing:.08em;
text-shadow:0 8px 30px rgba(0,0,0,.9);
}

.wall-title p{
margin-top:14px;
font-size:20px;
color:#d6c2a0;
text-shadow:0 4px 20px rgba(0,0,0,.9);
}

@media(max-width:760px){

.topbar{
flex-direction:column;
align-items:flex-start;
}

.nav{
width:100%;
}

.nav a{
width:100%;
}

.partner-wall{
min-height:auto;
}

.wall-overlay{
padding-top:120px;
}
}
</style>
</head>

<body>

<div class="wrap">

<header class="topbar">

<a class="brand" href="https://thorshall.gg">
<img src="img/logo.png" alt="Thor's Hall Logo">
<span>THOR'S HALL</span>
</a>

<nav class="nav">
<a href="https://thorshall.gg/about">About</a>
<a href="https://thorshall.gg/info">Info</a>
<a href="https://thorshall.gg/guide">Guide</a>
<a href="https://thorshall.gg/creators">Creators</a>
<a class="manager-btn" href="https://thorshall.gg/managers">Managers</a>
<a href="https://playrainbet.com/tkpmo0r1x" target="_blank" rel="nofollow sponsored noopener">Join Rainbet</a>
</nav>

</header>

<section class="partner-wall">

<img src="wall.png" alt="Thor's Hall Partner Wall">

<div class="wall-overlay">

<div class="wall-title">
<h1>PARTNERS</h1>
<p>The Hall of Partners is being forged.</p>
</div>

</div>

</section>

</div>

</body>
</html>
