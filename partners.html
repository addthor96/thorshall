<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Partners | Thor's Hall</title>
<meta name="description" content="Thor's Hall partner wall with live partner activity, creator network metrics and tracked partnership stats.">
<link rel="canonical" href="https://thorshall.gg/partners">

<style>
:root{
--gold:#d4a74f;
--gold2:#f0d28b;
--gold3:#fff0be;
--text:#f4ede2;
--muted:#d0c2ab;
--line:rgba(212,167,79,.24);
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
color:var(--text);
background:
linear-gradient(rgba(5,3,2,.20),rgba(5,3,2,.58)),
url('Wall.png') center top/cover no-repeat fixed;
min-height:100vh;
overflow-x:hidden;
}

.wrap{
max-width:1180px;
margin:auto;
padding:26px 18px 70px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:14px;
padding:16px 18px;
border-radius:20px;
border:1px solid var(--line);
background:rgba(0,0,0,.46);
backdrop-filter:blur(8px);
box-shadow:0 18px 44px rgba(0,0,0,.34);
}

.brand{
display:flex;
align-items:center;
gap:12px;
text-decoration:none;
color:white;
font-size:28px;
font-weight:900;
letter-spacing:.04em;
}

.brand img{
width:42px;
height:42px;
border-radius:10px;
object-fit:cover;
}

.nav{
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:flex-end;
}

.nav a{
display:inline-flex;
align-items:center;
justify-content:center;
padding:13px 22px;
border-radius:14px;
font-weight:900;
text-decoration:none;
border:1px solid rgba(255,230,170,.38);
background:linear-gradient(180deg,var(--gold3),var(--gold));
color:#211407!important;
box-shadow:0 10px 24px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.25);
}

.nav a.manager-btn{
color:#fff!important;
background:linear-gradient(180deg,#d7655c,#a83232 48%,#7f2424);
border-color:rgba(255,140,130,.52);
text-shadow:0 1px 0 rgba(0,0,0,.28);
}

.partner-wall{
margin-top:36px;
min-height:720px;
padding:70px 56px;
border-radius:28px;
background:rgba(0,0,0,.08);
}

.wall-inner{
max-width:920px;
margin:auto;
text-align:center;
}

.eyebrow{
display:inline-block;
padding:8px 14px;
border-radius:999px;
font-size:13px;
font-weight:900;
letter-spacing:.1em;
text-transform:uppercase;
color:var(--gold2);
border:1px solid rgba(240,210,139,.24);
background:rgba(0,0,0,.34);
}

h1{
font-size:clamp(44px,6vw,76px);
line-height:1;
margin:22px 0 14px;
text-shadow:0 4px 24px rgba(0,0,0,.75);
}

.lead{
max-width:780px;
margin:0 auto;
font-size:20px;
line-height:1.6;
color:#e8d8bd;
text-shadow:0 3px 16px rgba(0,0,0,.75);
}

@media(max-width:760px){
.topbar{
flex-direction:column;
align-items:flex-start;
}

.nav{
width:100%;
}

.nav a{
width:100%;
}

.partner-wall{
padding:46px 22px;
min-height:620px;
}
}
</style>
</head>

<body>

<div class="wrap">

<header class="topbar">
<a class="brand" href="https://thorshall.gg">
<img src="img/logo.png" alt="Thor's Hall Logo">
<span>THOR'S HALL</span>
</a>

<nav class="nav">
<a href="https://thorshall.gg/about">About</a>
<a href="https://thorshall.gg/info">Info</a>
<a href="https://thorshall.gg/guide">Guide</a>
<a href="https://thorshall.gg/creators">Creators</a>
<a class="manager-btn" href="https://thorshall.gg/managers">Managers</a>
<a href="https://playrainbet.com/tkpmo0r1x" target="_blank" rel="nofollow sponsored noopener">Join Rainbet</a>
</nav>
</header>

<main class="partner-wall">
<div class="wall-inner">
<div class="eyebrow">Live Partner Wall</div>
<h1>Hall of Partners</h1>
<p class="lead">
A dedicated wall for Thor's Hall partners, creator activity, tracked performance and future payout proof.
</p>
</div>
</main>

</div>

</body>
</html>
