<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>test-test</title>

<style>
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:
linear-gradient(rgba(8,5,3,.84),rgba(8,5,3,.97)),
url('viking-hall-bg.png') center/cover fixed no-repeat;
color:white;
overflow-x:hidden;
}

.wrap{
max-width:1180px;
margin:auto;
padding:26px 18px;
}

.site-head{
display:flex;
align-items:flex-start;
gap:12px;
position:relative;
z-index:20;
}

.topbar{
flex:1;
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 18px;
border-radius:20px;
border:1px solid rgba(212,167,79,.22);
background:rgba(0,0,0,.42);
backdrop-filter:blur(8px);
}

.brand{
display:flex;
align-items:center;
gap:12px;
text-decoration:none;
color:white;
font-size:28px;
font-weight:900;
letter-spacing:.03em;
}

.brand img{
width:42px;
height:42px;
border-radius:10px;
object-fit:cover;
}

.nav{
display:flex;
gap:10px;
align-items:center;
}

.nav a{
display:inline-flex;
align-items:center;
justify-content:center;
padding:13px 22px;
border-radius:14px;
font-weight:900;
text-decoration:none;
border:1px solid rgba(255,230,170,.38);
background:linear-gradient(180deg,#f0d28b,#d4a74f);
color:#211407;
box-shadow:
0 10px 24px rgba(0,0,0,.25),
inset 0 1px 0 rgba(255,255,255,.25);
}

.manager-btn{
background:linear-gradient(180deg,#d7655c,#a83232 48%,#7f2424)!important;
color:#fff!important;
}

.analytics-widget{
position:relative;
flex:0 0 auto;
margin-top:2px;
}

.analytics-trigger{
width:64px;
height:64px;
display:block;
transition:.18s ease;
filter:
drop-shadow(0 0 12px rgba(255,90,0,.45))
drop-shadow(0 0 24px rgba(255,120,0,.18));
}

.analytics-trigger:hover{
transform:translateY(-2px) scale(1.05);
filter:
drop-shadow(0 0 18px rgba(255,90,0,.72))
drop-shadow(0 0 38px rgba(255,120,0,.28));
}

.analytics-trigger img{
width:100%;
height:100%;
object-fit:contain;
display:block;
}

.analytics-panel{
position:absolute;
top:calc(100% + 10px);
right:0;
width:320px;
padding:18px;
border-radius:20px;
border:1px solid rgba(212,167,79,.28);
background:
linear-gradient(180deg,rgba(10,7,4,.98),rgba(20,12,7,.96));

box-shadow:0 22px 48px rgba(0,0,0,.48);

opacity:0;
visibility:hidden;
transform:translateY(8px);
transition:.18s ease;

pointer-events:none;
}

.analytics-widget:hover .analytics-panel{
opacity:1;
visibility:visible;
transform:translateY(0);
pointer-events:auto;
}

.analytics-title{
display:flex;
align-items:center;
gap:8px;
font-size:14px;
font-weight:900;
letter-spacing:.05em;
text-transform:uppercase;
color:#f0d28b;
margin-bottom:13px;
}

.analytics-dot{
width:8px;
height:8px;
border-radius:50%;
background:#ff7b32;
box-shadow:0 0 12px rgba(255,123,50,.75);
}

.analytics-row{
display:flex;
justify-content:space-between;
gap:16px;
padding:11px 0;
border-bottom:1px solid rgba(255,255,255,.07);
font-size:14px;
color:#d0c2ab;
}

.analytics-row strong{
color:#fff;
font-size:15px;
white-space:nowrap;
}

.analytics-note{
margin:13px 0 0;
font-size:12px;
line-height:1.45;
color:#9f927e;
}
</style>
</head>

<body>

<div class="wrap">

<div class="site-head">

<header class="topbar">

<a class="brand" href="#">
<img src="img/logo.png" alt="">
<span>THOR'S HALL</span>
</a>

<nav class="nav">
<a href="#">About</a>
<a href="#">Info</a>
<a href="#">Guide</a>
<a href="#">Creators</a>
<a class="manager-btn" href="#">Managers</a>
<a href="#">Join Rainbet</a>
</nav>

</header>

<div class="analytics-widget">

<a class="analytics-trigger" href="#">
<img src="img/infernal-diamond.png" alt="">
</a>

<div class="analytics-panel">

<div class="analytics-title">
<span class="analytics-dot"></span>
Recent partner stats
</div>

<div class="analytics-row">
<span>Wagered this month</span>
<strong>$7,143.33</strong>
</div>

<div class="analytics-row">
<span>Deposits tracked</span>
<strong>$525.16</strong>
</div>

<div class="analytics-row">
<span>Visits / registrations</span>
<strong>6 / 1</strong>
</div>

<p class="analytics-note">
Monthly partner snapshot. Updates automatically.
</p>

</div>
</div>

</div>
</div>

</body>
</html>
