<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Test Test</title>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(rgba(8,5,3,.84),rgba(8,5,3,.97)),url('viking-hall-bg.png') center/cover fixed no-repeat;color:white}
.wrap{max-width:1180px;margin:auto;padding:26px 18px}
.site-head{display:flex;align-items:flex-start;gap:12px;position:relative;z-index:20}
.topbar{flex:1;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-radius:20px;border:1px solid rgba(212,167,79,.22);background:rgba(0,0,0,.42)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:white;font-size:28px;font-weight:900}
.brand img{width:42px;height:42px;border-radius:10px;object-fit:cover}
.nav{display:flex;gap:10px}
.nav a{padding:13px 22px;border-radius:14px;font-weight:900;text-decoration:none;background:linear-gradient(180deg,#f0d28b,#d4a74f);color:#211407}
.nav .manager-btn{background:linear-gradient(180deg,#d7655c,#a83232 48%,#7f2424);color:white}

.analytics-widget{position:relative;margin-top:7px}
.analytics-trigger{
width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
background:
radial-gradient(circle at 32% 24%,#ffd08b 0 8%,transparent 18%),
radial-gradient(circle at 50% 48%,#ff5a18 0 35%,#7a1608 68%,#220704 100%);
border:2px solid #b86a21;
box-shadow:0 0 18px rgba(255,90,0,.55),0 0 36px rgba(255,120,0,.22);
text-decoration:none;
}
.analytics-trigger span{font-size:27px;color:#ffd36b;font-weight:900;text-shadow:0 0 10px #ff6a00}
.analytics-panel{
position:absolute;top:calc(100% + 10px);right:0;width:315px;padding:18px;border-radius:20px;
border:1px solid rgba(212,167,79,.28);background:linear-gradient(180deg,rgba(10,7,4,.98),rgba(20,12,7,.96));
box-shadow:0 22px 48px rgba(0,0,0,.48);opacity:0;visibility:hidden;transform:translateY(8px);transition:.18s ease;
}
.analytics-widget:hover .analytics-panel{opacity:1;visibility:visible;transform:translateY(0)}
.analytics-title{color:#f0d28b;font-weight:900;text-transform:uppercase;margin-bottom:13px}
.analytics-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07);color:#d0c2ab}
.analytics-row strong{color:white}
.analytics-note{font-size:12px;color:#9f927e}
</style>
</head>
<body>
<div class="wrap">
<div class="site-head">
<header class="topbar">
<a class="brand" href="#"><img src="img/logo.png"><span>THOR'S HALL</span></a>
<nav class="nav">
<a>About</a><a>Info</a><a>Guide</a><a>Creators</a><a class="manager-btn">Managers</a><a>Join Rainbet</a>
</nav>
</header>

<div class="analytics-widget">
<a class="analytics-trigger" href="#"><span>↗</span></a>
<div class="analytics-panel">
<div class="analytics-title">Recent partner stats</div>
<div class="analytics-row"><span>Wagered this month</span><strong>$7,143.33</strong></div>
<div class="analytics-row"><span>Deposits tracked</span><strong>$525.16</strong></div>
<div class="analytics-row"><span>Visits / registrations</span><strong>6 / 1</strong></div>
<p class="analytics-note">Monthly partner snapshot. Updates automatically.</p>
</div>
</div>

</div>
</div>
</body>
</html>
