name: Optimize web images

on:
  push:
    branches:
      - image-optimization

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: image-optimization
          fetch-depth: 0

      - name: Install image tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick webp

      - name: Create optimized WebP assets and update references
        shell: bash
        run: |
          set -euo pipefail

          convert_asset() {
            src="$1"
            dst="$2"
            max="$3"
            quality="$4"
            if [ -f "$src" ]; then
              convert "$src" -auto-orient -strip -resize "${max}x${max}>" -quality "$quality" "$dst"
              echo "$src -> $dst"
              ls -lh "$src" "$dst"
            fi
          }

          convert_asset "viking-hall-bg.png" "viking-hall-bg.webp" 1920 80
          convert_asset "img/hall-bg.jpg" "img/hall-bg.webp" 1920 80
          convert_asset "img/casinobackground.png" "img/casinobackground.webp" 1920 80
          convert_asset "img/wallbackground.png" "img/wallbackground.webp" 1920 80
          convert_asset "img/Wall.png" "img/Wall.webp" 1920 80
          convert_asset "img/infernal-diamond.png" "img/infernal-diamond.webp" 256 82
          convert_asset "img/logo.png" "img/logo.webp" 512 84
          convert_asset "wisdom.png" "wisdom.webp" 1600 80
          convert_asset "thatsme.png" "thatsme.webp" 1200 80

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'viking-hall-bg.png': 'viking-hall-bg.webp',
              'img/hall-bg.jpg': 'img/hall-bg.webp',
              'img/casinobackground.png': 'img/casinobackground.webp',
              'img/wallbackground.png': 'img/wallbackground.webp',
              'img/Wall.png': 'img/Wall.webp',
              'img/infernal-diamond.png': 'img/infernal-diamond.webp',
              'img/logo.png': 'img/logo.webp',
              'wisdom.png': 'wisdom.webp',
              'thatsme.png': 'thatsme.webp',
          }

          allowed = {'.html', '.css', '.js', '.json', '.xml', '.md', '.txt'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in allowed or '.git' in p.parts or '.github' in p.parts:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, repl in replacements.items():
                  new = new.replace(old, repl)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  print('updated', p)
          PY

          cat >> _headers <<'EOF'

          # Long-lived cache for optimized static images.
          /img/*
            Cache-Control: public, max-age=31536000, immutable

          /*.webp
            Cache-Control: public, max-age=31536000, immutable
          EOF

          rm -f .github/workflows/optimize-images.yml

      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Optimize heavy images for faster page loads"
          git push origin image-optimization
