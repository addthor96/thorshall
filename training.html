<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rune Reels Training Slot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #2a160c 0%, #100806 45%, #050303 100%);
      color: #f4dfb6;
      font-family: Georgia, 'Times New Roman', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .slot-page {
      width: 100%;
      max-width: 980px;
      background: linear-gradient(145deg, rgba(54, 31, 15, 0.98), rgba(18, 9, 6, 0.98));
      border: 2px solid #b98135;
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65), inset 0 0 50px rgba(255, 183, 77, 0.06);
      position: relative;
      overflow: hidden;
    }

    .slot-page::before {
      content: "";
      position: absolute;
      inset: -100px;
      background: radial-gradient(circle, rgba(255, 197, 102, 0.12), transparent 45%);
      pointer-events: none;
    }

    .header {
      text-align: center;
      position: relative;
      z-index: 1;
      margin-bottom: 26px;
    }

    .eyebrow {
      color: #d69b4a;
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(36px, 7vw, 72px);
      letter-spacing: 2px;
      color: #ffe2a1;
      text-shadow: 0 0 24px rgba(255, 168, 64, 0.25);
      margin-bottom: 8px;
    }

    .subtitle {
      color: #c6a574;
      font-size: 16px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      position: relative;
      z-index: 1;
      margin-bottom: 22px;
    }

    .stat {
      border: 1px solid rgba(185, 129, 53, 0.5);
      background: rgba(12, 6, 4, 0.65);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
    }

    .stat-label {
      color: #a78b62;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #ffd98b;
    }

    .machine {
      position: relative;
      z-index: 1;
      background: linear-gradient(180deg, #1c0f09, #080403);
      border: 2px solid #8d5f25;
      border-radius: 24px;
      padding: 22px;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.65);
      margin-bottom: 20px;
    }

    .reels {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .reel {
      display: grid;
      grid-template-rows: repeat(3, 100px);
      gap: 10px;
    }

    .symbol {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(34px, 6vw, 54px);
      background: radial-gradient(circle at top, #3a2010, #130907);
      border: 1px solid rgba(255, 190, 89, 0.35);
      border-radius: 18px;
      box-shadow: inset 0 0 24px rgba(255, 180, 70, 0.05), 0 8px 20px rgba(0, 0, 0, 0.35);
      transition: transform 0.16s ease, filter 0.16s ease, border-color 0.16s ease;
    }

    .symbol.win {
      border-color: #ffd166;
      filter: drop-shadow(0 0 14px rgba(255, 209, 102, 0.75));
      transform: scale(1.04);
    }

    .symbol.spin {
      animation: flicker 0.45s linear infinite;
    }

    @keyframes flicker {
      0% { transform: translateY(-4px); filter: blur(1px); }
      50% { transform: translateY(4px); filter: blur(2px); }
      100% { transform: translateY(-4px); filter: blur(1px); }
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
    }

    .bet-controls {
      display: flex;
      gap: 8px;
      justify-content: flex-start;
      flex-wrap: wrap;
    }

    button {
      border: none;
      cursor: pointer;
      font-family: inherit;
      border-radius: 999px;
      transition: transform 0.12s ease, opacity 0.12s ease, box-shadow 0.12s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .small-btn {
      background: rgba(255, 207, 128, 0.1);
      color: #ffd98b;
      border: 1px solid rgba(255, 207, 128, 0.35);
      padding: 10px 14px;
      font-size: 14px;
    }

    .spin-btn {
      width: 170px;
      height: 170px;
      background: radial-gradient(circle at top, #ffd36f, #b86b20 55%, #5d2b0d 100%);
      color: #160906;
      font-size: 32px;
      font-weight: bold;
      border: 4px solid #ffe7a9;
      box-shadow: 0 0 32px rgba(255, 166, 55, 0.38), inset 0 -12px 18px rgba(0, 0, 0, 0.22);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .right-controls {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .message {
      position: relative;
      z-index: 1;
      min-height: 48px;
      text-align: center;
      font-size: 22px;
      color: #ffe2a1;
      margin-bottom: 12px;
    }

    .paytable {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-top: 18px;
    }

    .pay-item {
      background: rgba(0, 0, 0, 0.26);
      border: 1px solid rgba(185, 129, 53, 0.28);
      border-radius: 14px;
      padding: 10px;
      text-align: center;
      font-size: 13px;
      color: #c8aa78;
    }

    .pay-symbol {
      font-size: 28px;
      display: block;
      margin-bottom: 5px;
    }

    .footer-note {
      position: relative;
      z-index: 1;
      text-align: center;
      color: #8f7555;
      font-size: 13px;
      margin-top: 18px;
    }

    @media (max-width: 760px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .reel {
        grid-template-rows: repeat(3, 70px);
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .bet-controls,
      .right-controls {
        justify-content: center;
      }

      .spin-btn {
        width: 130px;
        height: 130px;
        font-size: 25px;
        margin: 0 auto;
      }

      .paytable {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
  <main class="slot-page">
    <section class="header">
      <div class="eyebrow">Thor's Hall Training Build</div>
      <h1>Rune Reels</h1>
      <p class="subtitle">A fake-money Viking slot prototype for testing design, logic, and engagement.</p>
    </section>

    <section class="stats">
      <div class="stat">
        <div class="stat-label">Balance</div>
        <div class="stat-value" id="balance">1000</div>
      </div>
      <div class="stat">
        <div class="stat-label">Bet</div>
        <div class="stat-value" id="bet">10</div>
      </div>
      <div class="stat">
        <div class="stat-label">Last Win</div>
        <div class="stat-value" id="lastWin">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Spins</div>
        <div class="stat-value" id="spins">0</div>
      </div>
    </section>

    <section class="machine">
      <div class="reels" id="reels"></div>

      <div class="controls">
        <div class="bet-controls">
          <button class="small-btn" id="betDown">- Bet</button>
          <button class="small-btn" id="betUp">+ Bet</button>
        </div>

        <button class="spin-btn" id="spinBtn">Spin</button>

        <div class="right-controls">
          <button class="small-btn" id="autoBtn">Auto 10</button>
          <button class="small-btn" id="resetBtn">Reset</button>
        </div>
      </div>
    </section>

    <div class="message" id="message">Press spin to enter the hall.</div>

    <section class="paytable" id="paytable"></section>

    <p class="footer-note">Prototype only. Fake balance. No real money, no prizes, no external links.</p>
  </main>

  <script>
    const symbols = [
      { icon: '⚡', name: 'Lightning', weight: 6, pay: 20 },
      { icon: '🔨', name: 'Hammer', weight: 8, pay: 15 },
      { icon: '🛡️', name: 'Shield', weight: 10, pay: 10 },
      { icon: '🐺', name: 'Wolf', weight: 12, pay: 8 },
      { icon: '🐦‍⬛', name: 'Raven', weight: 14, pay: 6 },
      { icon: 'ᚱ', name: 'Rune', weight: 18, pay: 4 },
