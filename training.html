<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rune Reels 5x5 Training Slot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #2b1609 0%, #0b0503 58%, #020101 100%);
      color: #f7dfaa;
      font-family: Georgia, 'Times New Roman', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 22px;
    }

    .page {
      width: 100%;
      max-width: 1120px;
      background: linear-gradient(145deg, rgba(54, 30, 13, .98), rgba(13, 7, 5, .98));
      border: 2px solid #a56f23;
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 35px 90px rgba(0,0,0,.7);
    }

    .header { text-align: center; margin-bottom: 22px; }
    .eyebrow { color: #ce8c34; letter-spacing: 5px; font-size: 13px; text-transform: uppercase; margin-bottom: 10px; }
    h1 { font-size: clamp(42px, 7vw, 78px); color: #ffe5aa; letter-spacing: 2px; text-shadow: 0 0 20px rgba(255,181,74,.22); }
    .subtitle { color: #c4a06c; font-size: 15px; margin-top: 8px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: rgba(8,4,3,.78);
      border: 1px solid rgba(185,129,53,.35);
      border-radius: 15px;
      padding: 14px;
      text-align: center;
    }

    .stat span { display: block; color: #a98551; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; }
    .stat strong { color: #ffdd90; font-size: 25px; }

    .machine {
      background: radial-gradient(circle at center, #1f1008, #090403 70%);
      border: 2px solid #8d6129;
      border-radius: 24px;
      padding: 20px;
      box-shadow: inset 0 0 45px rgba(0,0,0,.75);
    }

    .reels {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .reel {
      display: grid;
      grid-template-rows: repeat(5, 78px);
      gap: 10px;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      border: 1px solid rgba(255,201,116,.32);
      background: linear-gradient(180deg, #3a1d0c, #120806);
      color: #ffe3a8;
      font-size: 32px;
      font-weight: 800;
      box-shadow: inset 0 0 18px rgba(255,190,95,.05), 0 9px 18px rgba(0,0,0,.36);
      user-select: none;
    }

    .cell.custom { font-size: 38px; }
    .cell.win {
      border-color: #ffd36b;
      box-shadow: 0 0 18px rgba(255,211,107,.65), inset 0 0 18px rgba(255,211,107,.15);
      transform: scale(1.04);
    }

    .cell.spin { animation: blurspin .15s linear infinite; }
    @keyframes blurspin { 0%{filter:blur(0); transform:translateY(-2px)} 50%{filter:blur(2px); transform:translateY(2px)} 100%{filter:blur(0); transform:translateY(-2px)} }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
    }

    .side { display: flex; gap: 10px; flex-wrap: wrap; }
    .side.right { justify-content: flex-end; }

    button {
      font-family: inherit;
      cursor: pointer;
      border: 1px solid rgba(255,207,128,.36);
      background: rgba(255,207,128,.08);
      color: #ffe09a;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 700;
    }

    button:disabled { opacity: .45; cursor: not-allowed; }
    button:active { transform: scale(.96); }

    .spin {
      width: 142px;
      height: 142px;
      border-radius: 50%;
      border: 4px solid #ffe4a3;
      background: radial-gradient(circle at top, #ffd77b, #bd7224 58%, #5d2b0d 100%);
      color: #160805;
      font-size: 27px;
      text-transform: uppercase;
      box-shadow: 0 0 32px rgba(255,170,60,.38);
    }

    .message {
      text-align: center;
      min-height: 42px;
      font-size: 22px;
      color: #ffe6ab;
      margin: 18px 0 6px;
    }

    .paytable {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 16px;
    }

    .pay {
      background: rgba(0,0,0,.28);
      border: 1px solid rgba(185,129,53,.25);
      border-radius: 13px;
      padding: 10px;
      text-align: center;
      color: #c9a878;
      font-size: 13px;
    }

    .pay b { display:block; color:#ffe0a0; font-size:22px; margin-bottom:4px; }
    .note { text-align:center; color:#8f7652; font-size:13px; margin-top:16px; }

    @media (max-width: 800px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .reel { grid-template-rows: repeat(5, 60px); }
      .cell { font-size: 24px; }
      .cell.custom { font-size: 28px; }
      .controls { grid-template-columns: 1fr; }
      .side, .side.right { justify-content: center; }
      .spin { width: 120px; height: 120px; margin: 0 auto; font-size: 22px; }
      .paytable { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="header">
      <div class="eyebrow">Thor's Hall Training Build</div>
      <h1>Rune Reels</h1>
      <p class="subtitle">5x5 fake-money slot prototype with 10 symbols.</p>
    </section>

    <section class="stats">
      <div class="stat"><span>Balance</span><strong id="balance">1000</strong></div>
      <div class="stat"><span>Bet</span><strong id="bet">10</strong></div>
      <div class="stat"><span>Last Win</span><strong id="lastWin">0</strong></div>
      <div class="stat"><span>Spins</span><strong id="spins">0</strong></div>
    </section>

    <section class="machine">
      <div class="reels" id="reels"></div>

      <div class="controls">
        <div class="side">
          <button id="betDown">- Bet</button>
          <button id="betUp">+ Bet</button>
        </div>

        <button class="spin" id="spinBtn">Spin</button>

        <div class="side right">
          <button id="autoBtn">Auto 10</button>
          <button id="resetBtn">Reset</button>
        </div>
      </div>
    </section>

    <div class="message" id="message">Press spin to enter the hall.</div>
    <section class="paytable" id="paytable"></section>
    <p class="note">Prototype only. Fake balance. No real money, no prizes, no external links.</p>
  </main>

  <script>
    const rows = 5;
    const cols = 5;
    const bets = [10, 20, 50, 100];

    const symbols = [
      { text: '10', name: 'Ten', weight: 20, pay: 2 },
      { text: 'J', name: 'Jack', weight: 18, pay: 3 },
      { text: 'Q', name: 'Queen', weight: 16, pay: 4 },
      { text: 'K', name: 'King', weight: 14, pay: 5 },
      { text: 'A', name: 'Ace', weight: 12, pay: 6 },
      { text: '🐦‍⬛', name: 'Raven', weight: 10, pay: 8, custom: true },
      { text: '🚢', name: 'Longship', weight: 9, pay: 10, custom: true },
      { text: '🔨', name: 'Hammer', weight: 7, pay: 14, custom: true },
      { text: 'ᛟ', name: 'Valknut', weight: 6, pay: 18, custom: true },
      { text: '⚡', name: 'Thor', weight: 4, pay: 25, custom: true }
    ];

    let balance = 1000;
    let betIndex = 0;
    let lastWin = 0;
    let spins = 0;
    let spinning = false;
    let autoLeft = 0;

    const reelsEl = document.getElementById('reels');
    const balanceEl = document.getElementById('balance');
    const betEl = document.getElementById('bet');
    const lastWinEl = document.getElementById('lastWin');
    const spinsEl = document.getElementById('spins');
    const messageEl = document.getElementById('message');
    const paytableEl = document.getElementById('paytable');
    const spinBtn = document.getElementById('spinBtn');
    const betUp = document.getElementById('betUp');
    const betDown = document.getElementById('betDown');
    const resetBtn = document.getElementById('resetBtn');
    const autoBtn = document.getElementById('autoBtn');

    function weightedSymbol() {
      const total = symbols.reduce((sum, s) => sum + s.weight, 0);
      let roll = Math.random() * total;
      for (const s of symbols) {
        roll -= s.weight;
        if (roll <= 0) return s;
      }
      return symbols[0];
    }

    function randomSymbol() {
      return symbols[Math.floor(Math.random() * symbols.length)];
    }

    function initGrid() {
      reelsEl.innerHTML = '';
      for (let c = 0; c < cols; c++) {
        const reel = document.createElement('div');
        reel.className = 'reel';
        for (let r = 0; r < rows; r++) {
          const cell = document.createElement('div');
          const s = randomSymbol();
          cell.className = 'cell' + (s.custom ? ' custom' : '');
          cell.dataset.row = r;
          cell.dataset.col = c;
          cell.textContent = s.text;
          reel.appendChild(cell);
        }
        reelsEl.appendChild(reel);
      }
    }

    function cells() { return [...document.querySelectorAll('.cell')]; }

    function updateStats() {
      balanceEl.textContent = balance;
      betEl.textContent = bets[betIndex];
      lastWinEl.textContent = lastWin;
      spinsEl.textContent = spins;
      spinBtn.disabled = spinning || balance < bets[betIndex];
      autoBtn.disabled = spinning || balance < bets[betIndex];
      betUp.disabled = spinning || betIndex >= bets.length - 1;
      betDown.disabled = spinning || betIndex <= 0;
    }

    function makeGrid() {
      const grid = [];
      for (let r = 0; r < rows; r++) {
        grid[r] = [];
        for (let c = 0; c < cols; c++) grid[r][c] = weightedSymbol();
      }
      return grid;
    }

    function calculate(grid) {
      let totalWin = 0;
      const winCells = [];
      const bet = bets[betIndex];

      // Beginner logic: 5 horizontal paylines only, left-to-right.
      for (let r = 0; r < rows; r++) {
        const first = grid[r][0].text;
        let count = 1;
        for (let c = 1; c < cols; c++) {
          if (grid[r][c].text === first) count++;
          else break;
        }

        if (count >= 3) {
          const symbol = grid[r][0];
          const multiplier = count === 3 ? 0.4 : count === 4 ? 0.7 : 1;
          const rowWin = Math.floor(bet * symbol.pay * multiplier);
          totalWin += rowWin;
          for (let c = 0; c < count; c++) winCells.push(`${r}-${c}`);
        }
      }

      return { totalWin, winCells };
    }

    function showGrid(grid, winCells) {
      cells().forEach(cell => {
        const r = Number(cell.dataset.row);
        const c = Number(cell.dataset.col);
        const s = grid[r][c];
        cell.textContent = s.text;
        cell.className = 'cell' + (s.custom ? ' custom' : '');
        if (winCells.includes(`${r}-${c}`)) cell.classList.add('win');
      });
    }

    function setSpinVisual(on) {
      spinning = on;
      cells().forEach(cell => {
        cell.classList.toggle('spin', on);
        cell.classList.remove('win');
      });
      updateStats();
    }

    function spin() {
      const bet = bets[betIndex];
      if (spinning || balance < bet) return;

      balance -= bet;
      lastWin = 0;
      spins++;
      messageEl.textContent = 'Reels are spinning...';
      setSpinVisual(true);
      updateStats();

      const flicker = setInterval(() => {
        cells().forEach(cell => {
          const s = randomSymbol();
          cell.textContent = s.text;
          cell.className = 'cell spin' + (s.custom ? ' custom' : '');
        });
      }, 70);

      setTimeout(() => {
        clearInterval(flicker);
        const grid = makeGrid();
        const result = calculate(grid);
        lastWin = result.totalWin;
        balance += lastWin;
        showGrid(grid, result.winCells);
        setSpinVisual(false);

        if (lastWin > 0) messageEl.textContent = `Win: ${lastWin} fake coins.`;
        else if (balance < bets[betIndex]) messageEl.textContent = 'Out of fake coins. Reset to continue.';
        else messageEl.textContent = 'No win. Spin again.';

        updateStats();

        if (autoLeft > 0 && balance >= bets[betIndex]) {
          autoLeft--;
          autoBtn.textContent = `Auto ${autoLeft}`;
          setTimeout(spin, 500);
        } else {
          autoLeft = 0;
          autoBtn.textContent = 'Auto 10';
        }
      }, 850);
    }

    function renderPaytable() {
      paytableEl.innerHTML = symbols.map(s => `
        <div class="pay"><b>${s.text}</b>5x pays ${s.pay}x bet</div>
      `).join('');
    }

    spinBtn.addEventListener('click', spin);
    betUp.addEventListener('click', () => { if (betIndex < bets.length - 1) betIndex++; updateStats(); });
    betDown.addEventListener('click', () => { if (betIndex > 0) betIndex--; updateStats(); });
    resetBtn.addEventListener('click', () => {
      balance = 1000;
      betIndex = 0;
      lastWin = 0;
      spins = 0;
      autoLeft = 0;
      messageEl.textContent = 'Reset complete. Press spin to enter the hall.';
      initGrid();
      updateStats();
    });
    autoBtn.addEventListener('click', () => { if (!spinning) { autoLeft = 10; autoBtn.textContent = 'Auto 10'; spin(); } });

    initGrid();
    renderPaytable();
    updateStats();
  </script>
</body>
</html>
